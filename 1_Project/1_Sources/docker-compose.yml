version: '3.9'

services:
  # Servicio para la aplicación Node.js
  app-base:
    build:
      context: ./app-base
    container_name: app-base
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: app-base-pwd
      DB_NAME: app-base
    ports:
      - "5555:5555"
    volumes:
      - /var/data/app-base:/data
    depends_on:
      - mysql
    # Usa un script de espera para asegurarte de que MySQL esté listo
    command: sh -c "dockerize -wait tcp://mysql:3306 -timeout 30s && npm start"

  # Servicio para MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: app-base-pwd
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password

  # Servicio para Nginx como proxy inverso
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro # Montar certificados en modo de solo lectura
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app-base

# Volúmenes
volumes:
  mysql_data:

networks:
  default:
    name: app_network