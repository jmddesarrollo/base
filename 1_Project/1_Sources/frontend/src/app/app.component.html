<!-- Contenedor del menú fijo -->
<div class="fixed-menu-container">
    <button
        type="button"
        pButton
        icon="pi pi-bars"
        label="{{ project }}"
        (click)="menu.toggle($event)"
        class="fixed-menu-button"
    ></button>
    <p-menu
        #menu
        [model]="items"
        [popup]="true"
        appendTo="body"
    ></p-menu>
</div>

<!-- Contenido principal -->
<div class="main-content">
    <div class="p-grid">
        <div class="p-col-8 center-col">
            <div class="toolbar" role="banner">
                <h3 class="w3-text-blue">{{ title }}</h3>
            </div>
        </div>
        <div class="p-col-2">
            <span class="w3-badge w3-right w3-margin-top w3-blue w3-margin-right" *ngIf="wrPermission === 'R' && websocketService.sessionOn"
                title="Permiso de lectura">
                {{ wrPermission }}
            </span>
            <span class="w3-badge w3-right w3-margin-top w3-blue w3-margin-right" *ngIf="wrPermission === 'W' && websocketService.sessionOn"
                title="Permiso de lectura y escritura">
                {{ wrPermission }}
            </span>
        </div>
    </div>

    <div class="w3-panel">
        <router-outlet></router-outlet>
    </div>
</div>

<p-toast></p-toast>

<p-confirmDialog></p-confirmDialog>

<div class="inactivity-modal" *ngIf="showInactivityWarning">
    <div class="inactivity-modal-content">
        <h3>Sesión a punto de expirar</h3>
        <p>Tu sesión expirará en 2 minutos debido a inactividad.</p>
        <p>¿Deseas continuar?</p>
        <div class="inactivity-modal-buttons">
            <button pButton label="Continuar sesión" (click)="extendSession()" class="p-button-success"></button>
            <button pButton label="Cerrar sesión" (click)="logout()" class="p-button-danger"></button>
        </div>
    </div>
</div>
