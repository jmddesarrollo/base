events {}

http {
    # Definimos el bloque upstream para "app-base"
    upstream app_base_backend {
        server app-base:5555;
    }

    # Configuración para redirección HTTP a HTTPS - app-base.example.com
    server {
        listen 80;
        server_name app-base.example.com www.app-base.example.com;

        # Soporte para Certbot (acme-challenge)
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        return 301 https://$host$request_uri;
    }

    # Configuración HTTPS para app-base.example.com
    server {
        listen 443 ssl;
        server_name app-base.example.com www.app-base.example.com;

        # Configuración de certificados
        ssl_certificate /etc/letsencrypt/live/app-base.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app-base.example.com/privkey.pem;

        # Configuración SSL recomendada
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Configuración de cabeceras adicionales para seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        location / {
            proxy_pass http://app_base_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte para WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}